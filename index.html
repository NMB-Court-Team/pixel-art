<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111419">
  <meta name="description" content="支持感知色差调色板的 45×45 像素画编辑器">
  <title>Pixel Atelier · 像素画工作台</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="stylesheet" href="css/global.css?v=20260819-37">
  <style>.topbar{grid-template-columns:minmax(0,1fr) auto}.stage-head{justify-content:flex-end}@media(max-width:900px){.topbar{grid-template-columns:minmax(0,1fr) auto}}@media(max-width:600px){.stage-head>div:first-child{display:flex}}</style>
</head>
<body class="dark-theme">
<div class="app">
  <header class="topbar">
    <nav id="toolStrip" class="tool-strip" aria-label="绘图工具">
      <button class="tool" data-action="files" data-panel="filesPanel" title="导入导出"><i>⇅</i><span>文件</span></button>
      <button class="tool active" data-tool="pen" data-panel="brushPanel" title="画笔 B · Shift 点击连接上一笔终点"><i>✎</i><span>画笔</span></button>
      <button class="tool" data-tool="eraser" data-panel="brushPanel" title="橡皮 E"><i>◇</i><span>橡皮</span></button>
      <button class="tool" data-tool="eyedropper" title="取色 Alt"><i>⌁</i><span>取色</span></button>
      <button class="tool" data-tool="fill" data-panel="fillPanel" title="填充 F"><i>◒</i><span>填充</span></button>
      <button class="tool" data-tool="line" title="直线"><i>╱</i><span>直线</span></button>
      <button class="tool" data-tool="rect" title="矩形"><i>□</i><span>矩形</span></button>
      <button class="tool" data-tool="circle" title="圆形"><i>○</i><span>圆形</span></button>
      <button class="tool" data-tool="select" data-panel="selectionPanel" title="选区 M"><i>▭</i><span>选区</span></button>
      <button class="tool" data-action="symmetry" data-panel="symmetryPanel" title="对称"><i>⌁</i><span>对称</span></button>
      <button class="tool" data-action="history" data-panel="historyPanel" title="历史记录"><i>↶</i><span>历史</span></button>
    </nav>
    <div class="top-actions">
      <button id="undo" class="icon-btn" title="撤销 Ctrl+Z">↶</button><button id="redo" class="icon-btn" title="重做 Ctrl+Y">↷</button>
      <button id="themeToggle" class="icon-btn" title="切换主题">☼</button>
    </div>
  </header>

  <section id="optionDock" class="option-dock" aria-live="polite">
    <div id="brushPanel" class="option-panel">
      <span id="brushPanelLabel" class="panel-label">画笔笔尖</span>
      <button data-brush-shape="circle">圆形</button><button data-brush-shape="square" class="active">方形</button>
      <label class="brush-radius-control">半径 <input id="brushRadius" type="range" min="0" max="8" step="1" value="0"><output>0 px</output></label>
    </div>
    <div id="fillPanel" class="option-panel">
      <span class="panel-label">填充模式</span>
      <button data-fill-mode="adjacent" class="active">邻接填充</button><button data-fill-mode="selection">选区填充</button>
      <span class="microcopy">选区填充在没有选区时会填满整个画布</span>
    </div>
    <div id="selectionPanel" class="option-panel">
      <span class="panel-label">选区</span>
      <button data-select-mode="rect" class="active">矩形选择</button><button data-select-mode="free">手涂选择</button>
      <button data-selection-action="move">移动</button><button data-selection-action="copy">复制</button><button data-selection-action="cut">剪切</button>
      <button data-selection-action="paste">粘贴</button><button data-selection-action="clear">取消</button><button data-selection-action="place" class="accent">确认放置</button>
    </div>
    <div id="symmetryPanel" class="option-panel">
      <span class="panel-label">对称模式</span>
      <button data-symmetry="horizontal">水平</button><button data-symmetry="vertical">垂直</button><button data-symmetry="both">双向</button>
      <button data-symmetry="rotate4">四向旋转</button><button data-symmetry="rotate8">八向旋转</button>
    </div>
    <div id="historyPanel" class="option-panel history-panel"><span class="panel-label">变动记录</span><div id="historyList" class="history-list"></div></div>
    <div id="filesPanel" class="option-panel">
      <span class="panel-label">文件</span><button id="importImage">导入图片</button><button id="exportPng" class="accent" title="导出 16× PNG；按住 Alt 导出 1×">导出 PNG</button>
      <button id="exportData">复制项目数据</button><button id="importData">导入项目数据</button>
    </div>
  </section>

  <main class="stage-shell">
    <section class="stage-head">
      <div class="view-controls">
        <button id="toggleGrid" class="quiet" title="网格 G">网格</button>
        <button id="zoomOut" class="icon-btn" title="缩小">−</button><output id="zoomValue">100%</output><button id="zoomIn" class="icon-btn" title="放大">＋</button>
        <button id="resetView" class="quiet">重置视角</button><button id="clearCanvas" class="danger">清空</button>
      </div>
    </section>
    <div id="viewport" class="viewport">
      <button id="cancelCanvasSelection" class="canvas-selection-cancel" type="button" data-selection-action="clear" hidden>× 取消选区</button>
      <div class="transparency-pattern" aria-hidden="true"></div>
      <div id="canvasTransform" class="canvas-transform">
        <div id="canvas" class="pixel-canvas" role="img" aria-label="45乘45像素画布"></div>
        <div id="previewLayer" class="layer preview-layer"></div><div id="selectionLayer" class="layer selection-layer"></div>
      </div>
      <div class="viewport-help"><span>滚轮缩放 · 右键拖动</span><span>双指缩放与移动</span></div>
    </div>
    <div class="statusbar"><span id="statusTool">画笔</span><span id="statusColor"><i style="background:#777777"></i><b>#777777</b></span><span id="statusCursor">—, —</span><span id="saveStatus">已自动保存</span><span id="appVersion"></span></div>
  </main>

  <aside id="colorDialog" class="color-sidebar" aria-label="颜色工作室">
    <div class="color-studio">
      <div class="view-tabs" role="tablist"><button type="button" data-color-view="lab" class="active">Lab 色域</button><button type="button" data-color-view="wheel">色相环</button><button type="button" data-color-view="channels">通道</button></div>
      <div class="studio-body">
        <section class="color-space">
          <div id="labView" class="color-view active"><div class="color-map-stack"><canvas id="labCanvas" width="420" height="300"></canvas><svg id="labOverlay" class="color-map-overlay" viewBox="0 0 420 300" aria-hidden="true"><g id="labRestrictionLayer"></g><g id="labMarkerLayer"></g><circle id="labCandidateMarker" class="candidate-marker" r="7"></circle></svg></div><label>L* 亮度 <input id="labLightness" type="range" min="0" max="100" value="50"><output>50</output></label></div>
          <div id="wheelView" class="color-view"><div class="color-map-stack wheel-map-stack"><canvas id="wheelCanvas" width="360" height="360"></canvas><svg id="wheelOverlay" class="color-map-overlay" viewBox="0 0 360 360" aria-hidden="true"><g id="wheelRestrictionLayer"></g><g id="wheelMarkerLayer"></g><circle id="wheelCandidateMarker" class="candidate-marker" r="7"></circle></svg></div><label>明度 <input id="wheelLightness" type="range" min="5" max="95" value="47"><output>47%</output></label></div>
          <div id="channelsView" class="color-view channels-view">
            <label class="hex-field">HEX <input id="hexInput" maxlength="7" value="#777777"><button id="nativePicker" type="button">拾色器</button><input id="nativeColor" type="color" value="#777777" tabindex="-1"></label>
            <fieldset><legend>RGB</legend><label>R <input id="rgbR" type="range" min="0" max="255" value="119"><output>119</output></label><label>G <input id="rgbG" type="range" min="0" max="255" value="119"><output>119</output></label><label>B <input id="rgbB" type="range" min="0" max="255" value="119"><output>119</output></label></fieldset>
            <fieldset><legend>HSL</legend><label>H <input id="hslH" type="range" min="0" max="360" value="0"><output>0°</output></label><label>S <input id="hslS" type="range" min="0" max="100" value="0"><output>0%</output></label><label>L <input id="hslL" type="range" min="0" max="100" value="47"><output>47%</output></label></fieldset>
            <fieldset><legend>Lab</legend><label>L* <input id="labLInput" type="number" min="0" max="100" step="0.1" value="50.0"></label><label>a* <input id="labAInput" type="number" min="-128" max="127" step="0.1" value="0.0"></label><label>b* <input id="labBInput" type="number" min="-128" max="127" step="0.1" value="0.0"></label></fieldset>
          </div>
        </section>
        <section class="color-inspector">
          <div id="candidatePreview" class="candidate-preview"><span style="background:#777777"></span><div><small>候选颜色</small><b>#777777</b></div></div>
          <div id="colorValidation" class="validation ok">可添加到调色板</div>
          <div class="color-actions"><button id="updateSelectedColor" type="button" class="accent" title="也可在色图上按 Alt 单击">更新选中颜色</button><button id="deleteSelectedColor" type="button" class="danger" disabled>删除选中颜色</button><button id="addCandidateColor" type="button" class="quiet add-color-action" title="也可在色图上按 Shift 单击">添加新颜色到调色板</button></div>
          <h3>调色板 <span id="studioPaletteCount">0 / 16</span><button id="clearPalette" type="button" class="danger palette-clear" disabled>清空</button></h3><label class="delta-rule-control">最小 ΔE00 <input id="minDeltaE" type="number" min="8" step="0.1" value="12" inputmode="decimal"><small>内置下限 8</small></label><div id="studioPalette" class="studio-palette" aria-label="颜色列表"></div>
          <p class="studio-tip">拖动色图只预览；Shift + 单击添加新颜色，Alt + 单击更新选中颜色。调色板颜色可点击编辑、长按或拖动排序，颜色之间至少相差 ΔE00 <span id="paletteDeltaRule">12</span>。</p>
        </section>
      </div>
    </div>
  </aside>
</div>

<input id="importImageFile" type="file" accept="image/*" hidden>
<dialog id="importDialog" class="studio-dialog">
  <form method="dialog" class="dialog-frame import-studio">
    <header><div><span class="eyebrow">IMAGE QUANTIZATION</span><h2>定位并转换图片</h2></div><button class="close-btn" value="close">×</button></header>
    <div class="import-layout"><div class="import-preview-wrap"><canvas id="importPreview" width="450" height="450"></canvas><p id="importPreviewHint">拖动图片调整位置，滚轮或滑块缩放</p></div>
      <aside><label>缩放 <input id="importScale" type="range" min="10" max="500" value="100"><output>100%</output></label><button id="fitImport" type="button" class="quiet wide">适应画布</button><button id="toggleImportPreview" type="button" class="quiet wide" aria-pressed="false">开启预览</button><label class="import-min-delta">颜色最小 ΔE00 <input id="importMinDeltaE" type="number" min="8" step="0.1" value="12" inputmode="decimal"><small>与工作台同步</small></label><label class="import-algorithm-select">处理方法 <select id="importAlgorithm"><option value="none">无偏差</option><option value="shift">颜色偏移恢复</option><option value="contrast">增强对比度</option><option value="balanced">区域感知均衡</option></select></label><label class="import-algorithm-option" data-algorithms="shift balanced" hidden>允许偏移量 ΔE00 <input id="importColorOffset" type="range" min="0" max="20" step="0.5" value="8"><output>8</output></label><label class="import-algorithm-option" data-algorithms="contrast balanced" hidden>目标邻接色差 <input id="importContrastTarget" type="range" min="8" max="30" step="0.5" value="12"><output>12</output></label><label class="import-algorithm-option" data-algorithms="contrast balanced" hidden>对比增强强度 <input id="importContrastStrength" type="range" min="0" max="100" step="5" value="65"><output>65%</output></label><label class="import-algorithm-option" data-algorithms="contrast balanced" hidden>区域识别阈值 <input id="importRegionThreshold" type="range" min="0.5" max="12" step="0.5" value="3"><output>3</output></label><div id="importAlgorithmNote" class="import-note">使用感知色差量化，不主动移动颜色或改变区域关系。</div><button id="confirmImport" type="button" class="accent wide">生成像素画</button></aside>
    </div>
  </form>
</dialog>

<dialog id="dataDialog" class="studio-dialog"><form method="dialog" class="dialog-frame data-dialog"><header><h2>项目数据</h2><button class="close-btn" value="close">×</button></header><textarea id="projectData" spellcheck="false"></textarea><div class="dialog-actions"><button id="copyProjectData" type="button">复制</button><button id="applyProjectData" type="button" class="accent">导入</button></div></form></dialog>

<script src="js/app.js?v=20260819-51"></script>
</body>
</html>
